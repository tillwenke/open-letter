<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statement on AI Extinction Risk</title>
<meta name="description" content="Mitigating the risk of extinction from AI should be a global priority alongside other societal-scale risks such as pandemics and nuclear war.">
<style>
  :root { --fg: #111; --muted: #666; --bg: #fff; --btn-fg: #fff; }
  @media (prefers-color-scheme: dark) { :root { --fg: #eee; --muted: #999; --bg: #111; --btn-fg: #111; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: Georgia, "Times New Roman", serif; }
  main { max-width: 40rem; margin: 0 auto; padding: 4rem 1rem; }
  h1 { font-weight: normal; font-size: 1.6rem; margin: 0 0 3rem; }
  blockquote { margin: 0 0 3rem; padding-left: 1.25rem; border-left: 2px solid var(--fg); font-size: 1.5rem; line-height: 1.5; }
  .btn { display: inline-block; padding: .75rem 1.5rem; background: var(--fg); color: var(--btn-fg); text-decoration: none; font-family: system-ui, sans-serif; font-size: 1rem; border-radius: 4px; }
  .btn:hover { opacity: .85; }
  .src { margin-top: 3rem; color: var(--muted); font-size: .9rem; line-height: 1.6; }
  .src a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Statement on AI Extinction Risk</h1>
  <blockquote>Mitigating the risk of extinction from AI should be a global priority alongside other societal-scale risks such as pandemics and nuclear war.</blockquote>
  <a class="btn" href="statement.pdf" download="Statement-on-AI-Extinction-Risk.pdf">Download PDF</a>
  <p class="src">Statement published by the Center for AI Safety, May 2023.<br>
  Original and signatories: <a href="https://aistatement.com/work/statement-on-ai-extinction-risk">aistatement.com</a></p>
</main>
</body>
</html>
